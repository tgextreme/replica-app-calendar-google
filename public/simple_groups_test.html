<!DOCTYPE html>
<html>
<head>
    <title>Simple Groups Test</title>
</head>
<body>
    <h2>Simple Groups API Test</h2>
    <div id="result"></div>
    <button onclick="testLogin()">1. Login Admin</button>
    <button onclick="testGroups()">2. Test Groups</button>
    <button onclick="testDirectURL()">3. Test Direct URL</button>
    
    <script src="https://cdn.jsdelivr.net/npm/axios@1.4.0/dist/axios.min.js"></script>
    <script>
    // Configure axios
    axios.defaults.withCredentials = true;
    
    function log(msg) {
        const div = document.getElementById('result');
        div.innerHTML += '<div>' + new Date().toLocaleTimeString() + ': ' + msg + '</div>';
        console.log(msg);
    }
    
    async function testLogin() {
        try {
            log('Testing login...');
            const response = await axios.post('/calendar/api/auth/login', {
                email: 'admin@calendario.local',
                password: 'passwd12345@'
            });
            log('Login SUCCESS: ' + response.data.message);
            log('User role: ' + response.data.user.role);
        } catch (error) {
            log('Login ERROR: ' + error.message);
        }
    }
    
    async function testGroups() {
        try {
            log('Testing groups endpoint...');
            log('Request URL: /calendar/api/groups');
            
            const response = await axios.get('/calendar/api/groups');
            log('Groups SUCCESS: Found ' + response.data.groups.length + ' groups');
            log('Is admin: ' + response.data.isAdmin);
        } catch (error) {
            log('Groups ERROR: ' + error.message);
            if (error.response) {
                log('Status: ' + error.response.status);
                log('Response: ' + JSON.stringify(error.response.data));
            }
        }
    }
    
    async function testDirectURL() {
        try {
            log('Testing with full URL...');
            const response = await axios.get('http://localhost/calendar/api/groups');
            log('Direct URL SUCCESS: Found ' + response.data.groups.length + ' groups');
        } catch (error) {
            log('Direct URL ERROR: ' + error.message);
            if (error.response) {
                log('Status: ' + error.response.status);
            }
        }
    }
    </script>
</body>
</html>
